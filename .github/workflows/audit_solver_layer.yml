---
concurrency:
  cancel-in-progress: true
  group: audit_solver_layer-${{ github.ref }}
jobs:
  audit-solver-layer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Audit the solver layer's wheels for advisories
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: src/api/endpoints/wan_syntheses/requirements-layer.txt
          internal-be-careful-extra-flags: --strict
          no-deps: true
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: default
            rules:
              empty-lines: {max: 0, max-start: 0, max-end: 1}
              key-ordering: enable
              line-length: disable
              new-line-at-end-of-file: enable
              truthy: {allowed-values: ["true", "false", "on"]}
          file_or_dir: .github/workflows/audit_solver_layer.yml
          strict: "true"
name: audit_solver_layer
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit_solver_layer.yml
      - src/api/endpoints/wan_syntheses/requirements-layer.txt
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
