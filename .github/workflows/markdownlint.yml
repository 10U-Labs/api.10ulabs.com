---
concurrency:
  cancel-in-progress: true
  group: markdownlint-${{ github.ref }}
jobs:
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Assert no inline lint disables
        uses: 10U-Labs/assert-no-inline-directives@latest
        with:
          files: .
          tools: markdownlint,yamllint
          verbose: 'true'
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Assert no linter config files
        uses: 10U-Labs/assert-no-linter-config-files@latest
        with:
          directories: .
          linters: markdownlint,yamllint
          verbose: 'true'
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install tools
        run: npm install -g markdownlint-cli
      - name: Lint Markdown
        run: markdownlint '**/*.md' '.claude/**/*.md' --disable MD013
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: default
            rules:
              empty-lines: {max: 0, max-start: 0, max-end: 1}
              key-ordering: enable
              line-length: disable
              new-line-at-end-of-file: enable
              truthy: {allowed-values: ["true", "false", "on"]}
          file_or_dir: .github/workflows/markdownlint.yml
          strict: 'true'
name: markdownlint
on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - .claude/**/*.md
      - .github/workflows/markdownlint.yml
  workflow_dispatch:
permissions:
  contents: read
