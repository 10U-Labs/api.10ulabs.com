---
description: >-
  Wait for the named workflow's run on this commit to finish, so a
  dependent applies against what this commit deploys before it
inputs:
  github_token:
    description: A token that may read this repository's workflow runs
    required: true
  workflow:
    description: The workflow file to wait for, such as common_routing.yml
    required: true
name: Wait For Workflow
outputs:
  apply:
    description: >-
      true when this commit started no run of the workflow, or started
      one that ended success. false when that run ended any other way,
      in which case the step fails too, so the dependent goes red with
      its foundation and a rerun of its failed jobs waits again
    value: ${{ steps.wait.outputs.apply }}
runs:
  steps:
    - env:
        GH_TOKEN: ${{ inputs.github_token }}
        POLL_LIMIT: '180'
        POLL_SECONDS: '20'
        WORKFLOW: ${{ inputs.workflow }}
      id: wait
      name: Wait for the workflow on this commit
      run: |
        if [ "$GITHUB_EVENT_NAME" != push ]; then
          echo "No push started this run, so no $WORKFLOW ran beside it."
          echo "apply=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        RUNS="repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs"
        FIELDS='.workflow_runs[] | "\(.status) \(.conclusion // "")"'
        POLL=0
        while [ "$POLL" -le "$POLL_LIMIT" ]; do
          RUN=$(gh api "$RUNS?head_sha=$GITHUB_SHA&per_page=1" \
            --jq "$FIELDS")
          if [ -z "$RUN" ]; then
            echo "This commit started no $WORKFLOW run to wait for."
            echo "apply=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${RUN% *}" = completed ]; then
            CONCLUSION=${RUN#* }
            echo "$WORKFLOW on this commit ended $CONCLUSION."
            if [ "$CONCLUSION" = success ]; then
              echo "apply=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "::error::$WORKFLOW on this commit ended $CONCLUSION, so this stack is not applied."
            exit 1
          fi
          echo "$WORKFLOW on this commit is ${RUN% *}. Waiting."
          sleep "$POLL_SECONDS"
          POLL=$((POLL + 1))
        done
        echo "::error::$WORKFLOW on this commit has not finished."
        exit 1
      shell: bash
  using: composite
